<div class="d-flex">

  <app-sidebar></app-sidebar>

  <main class="flex-grow-1 min-w-0">

    <div class="container mt-4">

      <h2>Categorías</h2>

      <p class="text-muted mb-4">
        Explora las publicaciones según tus intereses musicales.
      </p>

      <div class="row g-3">

        @for (categoria of categorias; track categoria.id) {

          <div class="col-12 col-md-6 col-lg-4">

            <a
              [routerLink]="['/publicaciones']"
              [queryParams]="{ categoria: categoria.id }"
              class="card h-100 text-decoration-none text-dark">

              <div class="card-body">

                <h5 class="card-title">
                  {{ categoria.nombre }}
                </h5>

                <p class="card-text text-muted">
                  {{ categoria.descripcion }}
                </p>

              </div>

            </a>

          </div>

        }

      </div>

    </div>

  </main>

</div>
