<div class="d-flex flex-column flex-md-row categorias-layout">

  <app-sidebar></app-sidebar>

  <main class="flex-grow-1 min-w-0 categorias-main">

    <div class="container-fluid categorias-container">

      <header class="categorias-header mb-4">
        <h2 class="fw-bold mb-2">Categorías</h2>

        <p class="text-muted mb-0">
          Explora las publicaciones según tus intereses musicales.
        </p>
      </header>

      <div class="row g-3">

        @for (categoria of categorias; track categoria.id) {

          <div class="col-12 col-md-6 col-lg-4">

            <a
              [routerLink]="['/publicaciones']"
              [queryParams]="{ categoria: categoria.id }"
              class="card categoria-card h-100 text-decoration-none"
            >

              <div class="card-body p-4">

                <h5 class="categoria-titulo">
                  {{ categoria.nombre }}
                </h5>

                <p class="categoria-descripcion mb-0">
                  {{ categoria.descripcion }}
                </p>

              </div>

            </a>

          </div>

        }

      </div>

    </div>

  </main>

</div>
