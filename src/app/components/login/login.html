<h2>Iniciar sesión</h2>

<form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">

  <div>
    <label for="correo">Correo electrónico</label>
    <input
      type="email"
      id="correo"
      name="correo"
      [(ngModel)]="datos.correo"
      required
      email
      #correo="ngModel"
    />

    @if (correo.invalid && correo.touched) {
      <p>Ingresa un correo electrónico válido.</p>
    }
  </div>

  <div>
    <label for="password">Contraseña</label>
    <input
      type="password"
      id="password"
      name="password"
      [(ngModel)]="datos.password"
      required
    />
  </div>

  @if (error) {
    <p>{{ error }}</p>
  }

  <button type="submit" [disabled]="loginForm.invalid">
    Iniciar sesión
  </button>

  <p>
    ¿No tienes cuenta?
    <a routerLink="/registro">Regístrate aquí</a>
  </p>

  <p>
    <a routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
  </p>

</form>
