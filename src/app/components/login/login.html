<div class="login-page">
  <div class="card login-card shadow-sm">
    <div class="card-body p-4">
      <div class="text-center mb-4">
        <h1 class="login-brand">Sonora</h1>
        <p class="text-muted mb-3">Comunidad musical</p>
        <h2 class="h4">Iniciar sesión</h2>
      </div>

      <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            class="form-control"
            placeholder="correo@ejemplo.cl"
            [(ngModel)]="datos.correo"
            required
            email
            #correo="ngModel"
          />

          @if (correo.invalid && correo.touched) {
            <p class="text-danger small mt-1">
              Ingresa un correo electrónico válido.
            </p>
          }
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            [(ngModel)]="datos.password"
            required
          />
        </div>

        @if (error) {
          <p class="text-danger small">{{ error }}</p>
        }

        <button
          type="submit"
          class="btn btn-primary w-100"
          [disabled]="loginForm.invalid"
        >
          Iniciar sesión
        </button>

        <div class="text-center mt-4">
          <p class="mb-2">
            ¿No tienes cuenta?
            <a routerLink="/registro">Regístrate aquí</a>
          </p>
          <p class="mb-0">
            <a routerLink="/recuperar-password">
              ¿Olvidaste tu contraseña?
            </a>
          </p>
        </div>
      </form>
    </div>
  </div>
</div>
